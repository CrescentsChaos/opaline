<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opaline: convert and download</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Bricolage Grotesque"', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
</script>
<style>
  :root { --ink: #0a0f1e; --mint: #5eead4; --iris: #818cf8; }
  body { background: var(--ink); color: #e6ebf5; }
  .orb { position: fixed; z-index: -1; border-radius: 9999px; filter: blur(100px); opacity: .4; animation: drift 22s ease-in-out infinite; }
  @keyframes drift { 50% { transform: translate(50px, -70px) scale(1.15); } }
  .glass { background: rgba(255,255,255,.055); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
           border: 1px solid rgba(255,255,255,.1); box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .drop { border: 1.5px dashed rgba(255,255,255,.22); transition: border-color .25s, background .25s, transform .25s; }
  .drop:hover, .drop:focus-within { border-color: var(--mint); background: rgba(94,234,212,.07); transform: translateY(-2px); }
  .ring { animation: ring 2.8s ease-out infinite; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(94,234,212,.45); } 100% { box-shadow: 0 0 0 28px rgba(94,234,212,0); } }
  .pop { animation: pop .35s cubic-bezier(.2,.9,.3,1.15); }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.97); } }
  .bar { background: linear-gradient(90deg, var(--iris), var(--mint)); transition: width .3s ease; }
  .bar.run { background: linear-gradient(90deg, var(--iris), var(--mint), var(--iris)); background-size: 200% 100%; animation: sheen 1.2s linear infinite; }
  @keyframes sheen { to { background-position: -200% 0; } }
  .chip { padding: .5rem .95rem; border-radius: .75rem; font-size: .875rem; background: rgba(255,255,255,.08);
          border: 1px solid rgba(255,255,255,.14); transition: background .2s, border-color .2s, transform .2s; }
  .chip:hover { background: rgba(255,255,255,.16); transform: translateY(-1px); }
  .chip.on { background: rgba(129,140,248,.3); border-color: rgba(165,180,252,.8); }
  .btn-dl { display: inline-flex; align-items: center; gap: .5rem; padding: .6rem 1.2rem; border-radius: .85rem; font-weight: 600;
            color: #04211d; background: var(--mint); transition: transform .2s, box-shadow .2s; }
  .btn-dl:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(94,234,212,.35); }
  :focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body class="font-sans min-h-screen antialiased">
  <div class="orb w-96 h-96 bg-indigo-500 -top-24 -left-24"></div>
  <div class="orb w-[28rem] h-[28rem] bg-teal-400 bottom-0 -right-32" style="animation-delay:-9s"></div>

  <div id="overlay" class="hidden fixed inset-0 z-50 pointer-events-none grid place-items-center bg-[#0a0f1e]/80 backdrop-blur-sm">
    <p class="text-3xl font-semibold">Drop to convert</p>
  </div>

  <main class="max-w-2xl mx-auto px-4 sm:px-6 py-10 sm:py-16">
    <p class="text-xl font-semibold tracking-tight text-teal-200 mb-6">Opaline</p>
    <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight">Drop it. Convert it. Download.</h1>
    <p id="lede" class="mt-3 text-slate-400 max-w-lg">Convert JPG, PNG and WebP images, or turn MP4 videos into MP3. We detect the type for you.</p>

    <section class="glass rounded-3xl p-4 sm:p-6 mt-8">
      <label class="drop block rounded-2xl text-center cursor-pointer px-4 py-10 sm:py-14">
        <input id="file" type="file" multiple class="sr-only" accept=".jpg,.jpeg,.png,.webp,.mp4,.m4v,.mov,.webm,.mkv,image/jpeg,image/png,image/webp,video/*">
        <span class="ring mx-auto mb-4 grid place-items-center w-14 h-14 rounded-full bg-teal-300/15 text-teal-200">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L8 8m4-4l4 4M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
        </span>
        <span class="block text-lg font-semibold">Drop files here, or tap to choose</span>
        <span class="block text-sm text-slate-400 mt-1">Images (JPG, PNG, WebP) and videos (MP4)</span>
      </label>

      <div id="yt" class="hidden">
      <div class="flex items-center gap-3 my-4 text-xs text-slate-500"><span class="h-px flex-1 bg-white/10"></span>or paste a link<span class="h-px flex-1 bg-white/10"></span></div>

      <form id="linkForm" class="flex gap-2">
        <input id="link" type="text" inputmode="url" autocomplete="off" placeholder="https://youtube.com/watch?v=…" aria-label="YouTube link"
               class="min-w-0 flex-1 rounded-xl bg-white/5 border border-white/10 px-4 py-3 placeholder:text-slate-500 focus:border-teal-300 focus:outline-none">
        <button class="chip font-semibold">Fetch video</button>
      </form>
      </div>
    </section>

    <section id="list" class="mt-6 space-y-3" aria-live="polite"></section>
    <p class="mt-10 text-xs text-slate-500">Images and videos are converted in your browser and never uploaded.</p>
  </main>

  <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-50 glass rounded-xl px-4 py-2.5 text-sm opacity-0 pointer-events-none transition-opacity duration-300"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
